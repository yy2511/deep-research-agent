name: CI and container image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/container-image.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "compose.execution.yaml"
      - "sandbox_image/**"
      - "deploy/**"
      - "fixtures/demo_run/events.jsonl"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "web/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-image.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "compose.execution.yaml"
      - "sandbox_image/**"
      - "deploy/**"
      - "fixtures/demo_run/events.jsonl"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "web/**"

concurrency:
  group: ci-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the production package name fixed regardless of which repository builds it.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/deep-research-agent

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    # The execution sandbox image (Node, Poppler, ImageMagick, compilers) takes longer to build.
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run pytest

      - name: Build execution sandbox
        run: docker build -t dra-sandbox:local sandbox_image

      - name: Test real execution boundaries and file delivery
        run: uv run pytest -q tests/test_execution_docker.py tests/test_execution_integration.py tests/test_artifacts.py tests/test_execution_render.py tests/test_execution_web.py tests/test_conversation_workspace.py tests/test_execution_pool.py --run-docker

  frontend-checks:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  build-test-publish:
    name: Build, smoke test, and publish
    if: github.event_name != 'pull_request'
    needs:
      - backend-tests
      - frontend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      - name: Smoke test the published image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          container="dra-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_dir="$(mktemp -d)"
          chmod 0777 "$data_dir"

          cleanup() {
            status=$?
            if (( status != 0 )); then
              docker logs "$container" 2>/dev/null || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf -- "$data_dir"
            exit "$status"
          }
          trap cleanup EXIT

          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "amd64"

          docker run --detach --name "$container" \
            --mount "type=bind,source=$data_dir,target=/data" \
            "$IMAGE" >/dev/null

          health=""
          for _ in $(seq 1 45); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$health" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 2
          done
          test "$health" = "healthy"

          docker exec --interactive "$container" python - <<'PY'
          import importlib.util
          import urllib.request

          assert urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=3).status == 200
          assert urllib.request.urlopen("http://127.0.0.1:8765/", timeout=3).status == 200

          for package in ("fastapi", "uvicorn", "ddgs"):
              assert importlib.util.find_spec(package) is not None, package
          for package in ("torch", "sentence_transformers", "transformers", "numpy", "rank_bm25"):
              assert importlib.util.find_spec(package) is None, package
          PY

          test "$(docker exec "$container" id -u)" = "999"
          # Node, Playwright MCP and Chromium are runtime tools for the browser;
          # npm, uv, secrets and frontend sources stay out of the image.
          docker exec "$container" sh -c '
            command -v node &&
            test -f /app/web/node_modules/@playwright/mcp/cli.js &&
            ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* &&
            ! command -v npm &&
            ! command -v uv &&
            ! test -e /app/.env &&
            ! test -e /app/web/src
          '

      - name: Point the convenience tag at the tested image
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:main" \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Record published version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published container image"
            echo
            echo "- Immutable tag: \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platform: \`linux/amd64\`"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "- Convenience tag: \`${IMAGE_NAME}:main\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
