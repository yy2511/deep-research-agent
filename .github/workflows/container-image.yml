name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/container-image.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "deploy/**"
      - "fixtures/demo_run/events.jsonl"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "web/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-image.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "deploy/**"
      - "fixtures/demo_run/events.jsonl"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "web/**"

concurrency:
  group: ci-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run pytest

  frontend-checks:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  container-smoke:
    name: Build and smoke test container
    needs:
      - backend-tests
      - frontend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: deep-research-agent:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test the built image
        env:
          IMAGE: deep-research-agent:ci-${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          container="dra-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_dir="$(mktemp -d)"
          chmod 0777 "$data_dir"

          cleanup() {
            status=$?
            if (( status != 0 )); then
              docker logs "$container" 2>/dev/null || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf -- "$data_dir"
            exit "$status"
          }
          trap cleanup EXIT

          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "amd64"

          docker run --detach --name "$container" \
            --mount "type=bind,source=$data_dir,target=/data" \
            "$IMAGE" >/dev/null

          health=""
          for _ in $(seq 1 45); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$health" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 2
          done
          test "$health" = "healthy"

          docker exec --interactive "$container" python - <<'PY'
          import importlib.util
          import urllib.request

          assert urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=3).status == 200
          assert urllib.request.urlopen("http://127.0.0.1:8765/", timeout=3).status == 200

          for package in ("fastapi", "uvicorn", "ddgs"):
              assert importlib.util.find_spec(package) is not None, package
          for package in ("torch", "sentence_transformers", "transformers", "numpy", "rank_bm25"):
              assert importlib.util.find_spec(package) is None, package
          PY

          test "$(docker exec "$container" id -u)" = "999"
          docker exec "$container" sh -c '
            ! command -v node &&
            ! command -v npm &&
            ! command -v uv &&
            ! test -e /app/.env &&
            ! test -e /app/web/node_modules
          '
