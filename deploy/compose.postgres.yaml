name: deep-research-agent-database

services:
  postgres:
    image: postgres:16
    env_file:
      - path: ./postgres.env
        required: true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:

networks:
  database:
    name: deep-research-agent-database
    internal: true
