<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1110" viewBox="0 0 440 1110" role="img" aria-labelledby="title desc"><title id="title">管理员运营概览移动端线框</title><desc id="desc">设计稿，所有数字为模拟数据，仅展示管理员可见汇总，不包含用户身份或提问内容。</desc><rect width="100%" height="100%" fill="#f5f7fa"/>
