[project]
name = "deep-research-agent"
version = "0.0.1"
description = "可复现、可审查、可部署的 Orchestrator-worker 深度研究 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2", # 数据结构（v2，区别于 v1）
    "openai", # 调用 LLM（OpenAI 兼容接口，支持官方 / 第三方中转）
    "tavily-python", # web_search 工具
    "requests>=2", # Exa / fetch_page 直连 HTTP；项目直接 import，不能只依赖 Tavily 间接带入
    "python-dotenv", # 从 .env 读取 API key
    "ddgs>=9.14.4", # Tavily + Exa 全挂时的轻量无 key 兜底
    "fastapi>=0.115",  # web 工作台后端（2026-07-07 spec：stdlib 单页退役）
    "uvicorn>=0.30",   # ASGI 服务器
]

# 本地语料索引/重排才需要；生产 Web 不启用这个 extra，避免安装 Torch/CUDA。
[project.optional-dependencies]
local-rag = [
    "numpy>=2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
]

# 开发期依赖（不进发布），PEP 735 dependency-groups，uv 默认安装
[dependency-groups]
dev = [
    "pytest",
    "httpx",  # fastapi TestClient 传输层
    # 默认离线测试会 import 本地索引并验证 BM25；真实 encoder 仍仅 --run-live。
    "numpy>=2",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout：把 src/dra 映射为可 import 的 `dra` 包
[tool.hatch.build.targets.wheel]
packages = ["src/dra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要联网 / 真实 API 调用的集成测试（默认跳过，加 --run-live 才跑）",
]
